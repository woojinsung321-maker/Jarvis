<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#03060f">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="JARVIS - personal AI assistant">
  <title>JARVIS</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/login.css">
  <link rel="stylesheet" href="/panels.css">
</head>
<body>
  <main id="login" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="reactor" aria-hidden="true"></div>
      <h1>J.A.R.V.I.S</h1>
      <p class="login-sub">Private system &middot; owner access only</p>
      <label class="sr-only" for="passphrase">Passphrase</label>
      <input id="passphrase" class="field" type="password" autocomplete="current-password" placeholder="Passphrase" required>
      <button type="submit" id="login-button" class="login-button">Authenticate</button>
      <p id="login-error" class="login-error" role="alert" hidden></p>
    </form>
  </main>

  <div class="app" id="app" hidden>
    <header class="topbar">
      <div class="brand">
        <button type="button" id="open-history" class="icon-btn" aria-label="Open conversation history" aria-controls="drawer" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="reactor" aria-hidden="true"></div>
        <div class="brand-text">
          <h1>J.A.R.V.I.S</h1>
          <span class="status"><i class="dot" aria-hidden="true"></i><span id="status-text">CONNECTING</span></span>
        </div>
      </div>
      <div class="actions">
        <button type="button" id="new-chat" class="icon-btn" aria-label="New chat">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button type="button" id="open-memory" class="icon-btn" aria-label="Open memory manager">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 2.8A3 3 0 0 0 5.2 13 3.2 3.2 0 0 0 9 18.5V4Zm6 0a3 3 0 0 1 3 3 3 3 0 0 1 2 2.8 3 3 0 0 1-1.2 3.2 3.2 3.2 0 0 1-3.8 5.5V4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" id="lock" class="icon-btn" aria-label="Lock">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
    </header>

    <main id="messages" class="messages" role="log" aria-live="polite" aria-label="Conversation"></main>

    <form id="composer" class="composer" autocomplete="off">
      <label class="sr-only" for="input">Message</label>
      <textarea id="input" rows="1" maxlength="4000" placeholder="Ask JARVIS…" enterkeyhint="send"></textarea>
      <button type="submit" id="send" class="send" aria-label="Send message">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6l-.01 6.5L15 12 3.39 13.9z" fill="currentColor"/></svg>
      </button>
    </form>
  </div>


  <!-- Conversation history drawer -->
  <div id="drawer-backdrop" class="backdrop" hidden></div>
  <aside id="drawer" class="drawer" hidden aria-label="Conversation history">
    <div class="panel-head">
      <h2 class="panel-title">Conversations</h2>
      <button type="button" id="close-history" class="icon-btn" aria-label="Close history">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <button type="button" id="drawer-new" class="btn primary wide">+ New chat</button>
    <p id="history-state" class="state" role="status" hidden></p>
    <ul id="conv-list" class="conv-list"></ul>
    <div class="drawer-foot">
      <button type="button" id="install" class="chip" hidden>Install app</button>
    </div>
  </aside>

  <!-- Memory manager -->
  <section id="memory-panel" class="sheet" hidden aria-label="Memory manager">
    <div class="sheet-inner">
      <div class="panel-head">
        <div>
          <h2 class="panel-title">Memory</h2>
          <span id="memory-count" class="muted-mono"></span>
        </div>
        <div class="head-actions">
          <button type="button" id="memory-add" class="btn primary">+ Add</button>
          <button type="button" id="close-memory" class="icon-btn" aria-label="Close memory manager">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <label class="sr-only" for="memory-search">Search memories</label>
      <input id="memory-search" class="field" type="search" maxlength="100" placeholder="Search memories…" autocomplete="off">
      <div id="memory-filters" class="filters" role="group" aria-label="Filter by category"></div>
      <p id="memory-state" class="state" role="status" hidden></p>
      <ul id="memory-list" class="memory-list"></ul>
      <div class="sheet-foot">
        <button type="button" id="memory-clear" class="btn danger wide">Clear all memories</button>
      </div>
    </div>
  </section>

  <!-- Memory editor (add / edit) -->
  <div id="memory-editor" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="editor-title">
    <form id="editor-form" class="modal-card" autocomplete="off">
      <h2 id="editor-title" class="modal-title">Memory</h2>
      <label class="form-label" for="editor-category">Category</label>
      <select id="editor-category" class="field"></select>
      <label class="form-label" for="editor-content">What should JARVIS remember?</label>
      <textarea id="editor-content" class="field area" rows="4" maxlength="500"></textarea>
      <div class="form-row"><span id="editor-count" class="muted-mono">0 / 500</span></div>
      <p id="editor-error" class="form-error" role="alert" hidden></p>
      <div id="editor-similar" class="similar" hidden></div>
      <div class="modal-actions">
        <button type="button" id="editor-cancel" class="btn">Cancel</button>
        <button type="button" id="editor-force" class="btn" hidden>Save anyway</button>
        <button type="submit" id="editor-save" class="btn primary">Save</button>
      </div>
    </form>
  </div>

  <!-- Generic confirm / text prompt -->
  <div id="dialog" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div class="modal-card">
      <h2 id="dialog-title" class="modal-title"></h2>
      <p id="dialog-message" class="modal-text"></p>
      <input id="dialog-input" class="field" maxlength="80" hidden>
      <p id="dialog-error" class="form-error" role="alert" hidden></p>
      <div class="modal-actions">
        <button type="button" id="dialog-cancel" class="btn">Cancel</button>
        <button type="button" id="dialog-ok" class="btn primary">OK</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
