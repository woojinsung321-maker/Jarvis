<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#03060f">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="JARVIS - personal AI assistant">
  <title>JARVIS</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <div class="reactor" aria-hidden="true"></div>
        <div class="brand-text">
          <h1>J.A.R.V.I.S</h1>
          <span class="status"><i class="dot" aria-hidden="true"></i><span id="status-text">LOCAL MODE</span></span>
        </div>
      </div>
      <div class="actions">
        <button type="button" id="install" class="chip" hidden>Install</button>
        <button type="button" id="new-chat" class="chip">New chat</button>
      </div>
    </header>

    <main id="messages" class="messages" role="log" aria-live="polite" aria-label="Conversation"></main>

    <form id="composer" class="composer" autocomplete="off">
      <label class="sr-only" for="input">Message</label>
      <textarea id="input" rows="1" maxlength="4000" placeholder="Ask JARVIS…" enterkeyhint="send"></textarea>
      <button type="submit" id="send" class="send" aria-label="Send message">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6l-.01 6.5L15 12 3.39 13.9z" fill="currentColor"/></svg>
      </button>
    </form>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
